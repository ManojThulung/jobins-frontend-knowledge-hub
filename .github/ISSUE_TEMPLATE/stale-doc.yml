name: Doc is wrong or out of date
description: A doc exists but no longer matches reality.
title: "[stale] "
labels: ["stale-doc"]
body:
  - type: input
    id: doc
    attributes:
      label: Which doc?
      placeholder: docs/features/dx-billing-support.md
    validations:
      required: true
  - type: textarea
    id: whats-wrong
    attributes:
      label: What is wrong?
    validations:
      required: true
