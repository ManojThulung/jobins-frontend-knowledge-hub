name: Doc health

on:
  pull_request:
    paths: ['docs/**', 'scripts/**']
  push:
    branches: [main]
  schedule:
    # 07:00 Nepal time (01:15 UTC) on the 1st of each month — the freshness sweep
    - cron: '15 1 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontmatter and report staleness
        shell: bash   # enables pipefail, so errors still fail the job through tee
        run: node scripts/check-docs.mjs | tee report.txt

      - name: Open the monthly freshness sweep issue
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const month = new Date().toLocaleString('en', { month: 'long', year: 'numeric' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Freshness sweep — ${month}`,
              labels: ['freshness-sweep'],
              body: [
                '20 minutes in the team meeting. For each stale doc:',
                'update it, reassign it, or delete it. Deleting a doc nobody',
                'needs is a good outcome.',
                '',
                '```',
                report.trim(),
                '```',
              ].join('\n'),
            });
